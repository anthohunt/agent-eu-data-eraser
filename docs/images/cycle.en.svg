<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" font-family="Helvetica, Arial, sans-serif">
  <title>Lifecycle of a request: send, reply, follow-up, complaint, renewal</title>
  <rect width="900" height="210" fill="#ffffff"/>
  <line x1="60" y1="80" x2="830" y2="80" stroke="#c9d1dd" stroke-width="4"/>
  <g font-size="13" fill="#14213d" text-anchor="middle">
    <circle cx="80" cy="80" r="11" fill="#1f4fd1"/><text x="80" y="50" font-weight="700">Day 0</text><text x="80" y="112">request by email</text><text x="80" y="129" font-size="12" fill="#5d6b82">to the DPO (Art. 17)</text>
    <circle cx="260" cy="80" r="11" fill="#1f7a4f"/><text x="260" y="50" font-weight="700">Every morning</text><text x="260" y="112">reply read and sorted</text><text x="260" y="129" font-size="12" fill="#5d6b82">erased, no data, refusal…</text>
    <circle cx="450" cy="80" r="11" fill="#a86410"/><text x="450" y="50" font-weight="700">1 month</text><text x="450" y="112">automatic follow-up</text><text x="450" y="129" font-size="12" fill="#5d6b82">legal deadline (Art. 12(3))</text>
    <circle cx="630" cy="80" r="11" fill="#b3261e"/><text x="630" y="50" font-weight="700">2 months</text><text x="630" y="112">CNIL complaint prepared</text><text x="630" y="129" font-size="12" fill="#5d6b82">text + evidence, you file it</text>
    <circle cx="790" cy="80" r="11" fill="#5d6b82"/><text x="790" y="50" font-weight="700">3 months</text><text x="790" y="112">new request</text><text x="790" y="129" font-size="12" fill="#5d6b82">the request renewed</text>
  </g>
  <text x="440" y="185" font-size="13" fill="#5d6b82" text-anchor="middle">Every Monday: a report by email (goal, what needs you, status of each broker) and new brokers to approve.</text>
</svg>
